workflows:
  ios-testflight:
    name: PULT Control iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic PULT Control
    environment:
      flutter: stable
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.pult.pultControlApp
    scripts:
      - name: Install Flutter packages
        script: flutter pub get
      - name: Verify Flutter application
        script: |
          flutter analyze
          flutter test
      - name: Apply App Store code signing
        script: xcode-project use-profiles
      - name: Build signed iOS IPA
        script: flutter build ipa --release --build-number=$BUILD_NUMBER
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
